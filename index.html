<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Case Declension </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>German Case Declension</h1>

        <section class="problem">

            <div class="item">
                <h2>Sentence:</h2>
                <p id="sentence"></p>
            </div>

            <div class="item">
                <h2>Article:</h2>
                <p id="article"></p>
            </div>

            <div class="item">
                <h2>Adjective:</h2>
                <p id="adjective"></p>
            </div>

            <div class="item">
                <h2>Noun:</h2>
                <p id="noun"></p>
            </div>

        </section>

        <div class="buttons">
            <button id="newProblem">Generate New Problem</button>
            <button id="showAnswer">Show Answer</button>
        </div>

        <section id="answerSection" class="answer hidden">
            <h2>Answer:</h2>
            <p id="answer"></p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
